{% extends "base.html" %}
{% block title %}ShadeGrid — Register{% endblock %}
{% block content %}

<h1>Create an account</h1>
<p class="lede">Password needs 8+ characters, one uppercase letter, one digit, and one symbol.</p>

<form method="POST">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required>

    <label for="password">Password</label>
    <div class="password-field">
        <input type="password" id="password" name="password" required>
        <button type="button" class="toggle-visibility" onclick="togglePassword('password', this)" aria-label="Show password">show</button>
    </div>

    <button type="submit">Register</button>
</form>

{% endblock %}
